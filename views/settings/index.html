<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聊天记录查询 · 设置</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v10l4-3h4M7 7h9M7 10h4"/><circle cx="16" cy="16" r="4"/><path d="m19 19 3 3"/></svg></div>
        <div><h1>聊天记录查询</h1><p class="subtitle">让机器人帮你翻聊天记录，查询范围由你决定。</p></div>
      </div>
      <div class="header-actions"><span id="live-status" class="pill">正在连接</span><button type="button" id="refresh-button" class="quiet">刷新设置</button></div>
    </header>
    <nav id="navigation" aria-label="设置分类">
      <button type="button" data-tab="overview" class="nav-item is-active" aria-pressed="true">使用概况</button>
      <button type="button" data-tab="instances" class="nav-item" aria-pressed="false">连接机器人<span class="count" data-count="instances">0</span></button>
      <button type="button" data-tab="readers" class="nav-item" aria-pressed="false">谁能查询<span class="count" data-count="readers">0</span></button>
      <button type="button" data-tab="aliases" class="nav-item" aria-pressed="false">常用名称<span class="count" data-count="aliases">0</span></button>
      <button type="button" data-tab="limits" class="nav-item" aria-pressed="false">查询设置</button>
    </nav>
    <div id="notice" class="notice" role="status" hidden><p></p></div>
    <div id="load-error" class="error-banner" role="alert" hidden></div>
    <section class="editor" aria-labelledby="section-title">
      <div class="editor-heading"><div><h2 id="section-title">使用概况</h2><p id="section-description" class="muted">正在加载设置…</p></div><span id="dirty-badge" class="pill">已保存</span></div>
      <div id="editor-content"><div class="loading"><span class="spinner"></span>正在加载设置</div></div>
    </section>
    <footer class="save-bar"><p id="save-hint" role="status">设置尚未加载</p><div class="actions"><button type="button" id="discard-button" disabled>撤销修改</button><button type="button" id="save-button" class="primary" disabled>保存设置</button></div></footer>
    <p class="page-footer">在这里设置，回到聊天中查询。</p>
  </main>
  <div id="help-tooltip" role="tooltip" hidden></div>
  <div id="toast" role="status" hidden></div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <h2 id="confirm-title">确认操作</h2><p id="confirm-text"></p>
    <div class="dialog-actions"><button type="button" id="confirm-cancel">取消</button><button type="button" id="confirm-ok" class="primary">确认</button></div>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
