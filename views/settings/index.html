<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授权历史查询 · 管理</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v7M15 3v5h4M5 3v18h7M8 11h7M8 15h3"/><circle cx="17" cy="18" r="3"/><path d="m19.2 20.2 2.3 2.3"/></svg></div>
        <div><p class="eyebrow">HISTORY QUERY / ASTRBOT</p><h1>授权历史查询</h1><p class="subtitle">配置谁可以查询、能查哪些记录，以及每次查询的资源额度。</p></div>
      </div>
      <div class="header-actions"><span id="live-status" class="pill">正在连接</span><button type="button" id="refresh-button">刷新</button></div>
    </header>

    <div id="notice" class="notice" role="status"><span class="notice-dot"></span><p>正在从 AstrBot 读取插件设置…</p></div>
    <div id="load-error" class="error-banner" role="alert" hidden></div>

    <div class="workspace">
      <aside class="sidebar" aria-label="管理导航">
        <div class="sidebar-title"><p class="eyebrow">WORKSPACE</p><h2>管理设置</h2></div>
        <nav id="navigation">
          <button type="button" data-tab="overview" class="nav-item is-active"><span class="nav-symbol">◫</span><span>概览</span></button>
          <button type="button" data-tab="instances" class="nav-item"><span class="nav-symbol">▣</span><span>机器人实例</span><span class="count" data-count="instances">0</span></button>
          <button type="button" data-tab="readers" class="nav-item"><span class="nav-symbol">◎</span><span>查询用户</span><span class="count" data-count="readers">0</span></button>
          <button type="button" data-tab="aliases" class="nav-item"><span class="nav-symbol">≡</span><span>会话别名</span><span class="count" data-count="aliases">0</span></button>
          <button type="button" data-tab="limits" class="nav-item"><span class="nav-symbol">⚙</span><span>资源与审计</span></button>
        </nav>
        <div class="sidebar-note"><span class="tiny-dot"></span><strong>共用插件配置</strong><p>这里与原插件配置页使用同一份设置。所有更改保存后生效。</p></div>
      </aside>

      <section class="editor" aria-labelledby="section-title">
        <div class="editor-heading"><div><p id="section-kicker" class="eyebrow">OVERVIEW</p><h2 id="section-title">查询控制台</h2><p id="section-description" class="muted">连接中，请稍候。</p></div><span id="dirty-badge" class="pill">已保存</span></div>
        <div id="editor-content" aria-live="polite"><div class="loading"><span class="spinner"></span>正在加载设置</div></div>
        <footer class="save-bar"><p id="save-hint">设置尚未加载</p><div class="actions"><button type="button" id="discard-button" disabled>放弃更改</button><button type="button" id="save-button" class="primary" disabled>保存设置</button></div></footer>
      </section>
    </div>
    <footer class="page-footer">授权历史查询 <span>·</span> 仅管理插件设置 <span>·</span> 历史检索仍在聊天中进行</footer>
  </main>
  <div id="toast" role="status" hidden></div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title">确认操作</h2><p id="confirm-text"></p>
    <div class="dialog-actions"><button type="button" id="confirm-cancel">取消</button><button type="button" id="confirm-ok" class="primary">确认</button></div>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
