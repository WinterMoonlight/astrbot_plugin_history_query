[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-plugin-history-query"
version = "0.2.0"
description = "Bounded, authorized cross-session AstrBot history queries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["history_query*"]

[tool.ruff]
target-version = "py312"
line-length = 100
